<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polymux</title>
<style>
:root{color-scheme:light dark;--surface:#fff;--bg:#f5f5f5;--text:#171717;--muted:#555;--line:#888;--accent:#174ea6;--on:#fff}
@media(prefers-color-scheme:dark){:root{--surface:#1e1e1e;--bg:#131313;--text:#f5f5f5;--muted:#c0c0c0;--line:#999;--accent:#a8c7fa;--on:#102444}}
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:16px}h1{margin:0;font-size:22px}header span{color:var(--muted);font-size:14px}main{display:grid;grid-template-columns:230px 1fr;height:calc(100dvh - 62px)}nav{padding:12px;background:var(--surface);border-right:1px solid var(--line);overflow:auto}button,select,textarea{font:inherit}button{cursor:pointer;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}button:hover{filter:brightness(.9)}button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}nav button{display:block;width:100%;text-align:left;margin:4px 0;border-color:transparent}nav button[aria-pressed=true]{background:var(--accent);color:var(--on)}nav small{display:block;font-size:12px;color:inherit;margin-top:4px}section{display:flex;flex-direction:column;min-height:0;min-width:0}#heading{margin:0;padding:14px 20px;font-size:18px;border-bottom:1px solid var(--line);background:var(--surface)}#messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px 16px;max-width:900px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}.message.user{align-self:flex-end;background:var(--accent);color:var(--on)}.label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}#status{padding:0 20px;color:var(--muted);min-height:24px;font-size:14px}form{padding:12px 20px 20px;display:flex;gap:10px;align-items:flex-end}textarea{width:100%;resize:vertical;min-height:64px;max-height:180px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px}#send{background:var(--accent);color:var(--on);min-height:44px}button:disabled{cursor:default;opacity:.6}@media(max-width:650px){main{grid-template-columns:115px 1fr}nav{padding:6px}nav button{padding:9px 6px}nav small{display:none}form{padding:8px;gap:6px}#messages{padding:10px}.message{padding:10px}header span{display:none}}
</style>
<header><h1>Polymux</h1><span>Your agents on cvmini</span></header><main><nav id="agents" aria-label="Conversations">Loading agents…</nav><section><h2 id="heading">Choose an agent</h2><div id="messages" role="log" aria-label="Messages"></div><div id="status" role="status"></div><form><textarea id="text" aria-label="Message" placeholder="Message your agent" required disabled></textarea><button id="send" disabled>Send</button></form></section></main>
<script>
let current=null,agents=[],last='',loading=false;const el=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}
function status(s){el('status').textContent=s}function render(messages){let serial=JSON.stringify(messages);if(serial===last)return;last=serial;const box=el('messages');let bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-80;box.replaceChildren();if(!messages.length){box.textContent='Start a conversation.';return}for(const m of messages){let parts=(m.parts||[]).filter(p=>p.text).map(p=>p.text).join('\n');if(!parts)continue;let div=document.createElement('div');div.className='message '+m.role;let label=document.createElement('span');label.className='label';label.textContent=m.role==='user'?'You':(agents.find(a=>a.id===m.agentID)?.name||el('heading').textContent);div.append(label,document.createTextNode(parts));box.append(div)}if(bottom)box.scrollTop=box.scrollHeight}
async function refresh(){if(!current||loading)return;loading=true;try{let d=await api('/threads/'+current+'/messages');render(Array.isArray(d)?d:(d.messages||[]));status('')}catch(e){status(e.message)}finally{loading=false}}
async function select(id,name){current=id;last='';el('heading').textContent=name;el('text').disabled=false;el('send').disabled=false;for(let b of el('agents').querySelectorAll('button'))b.setAttribute('aria-pressed',b.dataset.id===id);el('messages').textContent='Loading messages…';await refresh();el('messages').scrollTop=el('messages').scrollHeight}
async function init(){try{agents=await api('/agents');let threads=await api('/threads');el('agents').replaceChildren();for(let a of [...agents,...threads.filter(t=>t.id!==t.agentID).map(t=>({id:t.id,name:t.title,role:'Group'}))]){let b=document.createElement('button');b.dataset.id=a.id;b.setAttribute('aria-pressed','false');b.append(document.createTextNode(a.name));let s=document.createElement('small');s.textContent=a.role;b.append(s);b.onclick=()=>select(a.id,a.name);el('agents').append(b)}let chief=agents.find(a=>a.name==='Chief');if(chief)await select(chief.id,chief.name)}catch(e){el('agents').textContent='Cannot load agents.';status(e.message)}}
document.querySelector('form').onsubmit=async e=>{e.preventDefault();let text=el('text').value.trim();if(!text||!current)return;el('send').disabled=true;status('Sending…');try{await api('/threads/'+current+'/messages',{id:'web-'+Date.now()+'-'+Math.random().toString(36).slice(2),text,attachmentIDs:[]});el('text').value='';await refresh();status('Agent is replying…')}catch(e){status(e.message)}finally{el('send').disabled=false}};init();setInterval(refresh,2000);
</script></html>
