# Polymux local agent lanes (read by scripts/run-lane.sh, verify.sh, bootstrap-mac.sh).
# cvmini (13 Oct 2026): hw.memsize 17179869184 (16 GB), 12 CPU, Xcode 27.0 (27A266a),
# macOS 27.0.1, / 228Gi size, 49Gi free.
# 2 concurrent cold verify.sh (13 Oct): used 7.5 -> 11.0 GB peak, swap +0, pressure normal,
# min free 59%. Recommendation: 3 lanes, 2 build slots; lane-gate still gates each start.
# Secrets are NEVER stored here: `key` is a vault entry title read at run time.
# Any lane field may have a per-host override `field@<hostname -s>` (e.g. key@cvmini).

max_builds = 2          # concurrent xcodebuild slots (verify.sh drops to 1 while ~/ops/pr-verify builds)
lock_dir = "~/ops/lanes/locks"
sim_device = "iPhone 17"
sim_template = "polymux-template"
mac_hosts = ["cvmini", "cvmac"]   # hosts allowed to run Xcode/Swift units (dispatch-guard.sh)
# Pinned Cursor CLI installer (bootstrap-mac.sh). Update both together; never curl|bash.
cursor_install_url = "https://cursor.com/install"
cursor_install_sha256 = ""        # empty = refuse automatic install; install manually (README)

# Lane layout (Carlvince, 13 Oct 2026, final): lane3 (Codex) is the ONLY primary; lane4 (OpenCode) is the
# standing failover (role fallback); lane1 (main Cursor Ultra account) and lane2 are disabled. No second Cursor lane.
# lane3 max_concurrent = 2: codex exec runs parallel sessions on one ChatGPT login (shared rate limit);
# builds are still capped by max_builds/locks. run-lane.sh refuses a 3rd concurrent lane3 run (exit 5).
# run-lane.sh refuses a disabled/expired/unknown lane, or one whose key/account/env points at the main
# account (case-insensitive SUBSTRING: forbidden_keys, "ultra", "carlvincetan@gmail"; so ANY title containing "ultra" is refused), with exit 5 before any claim,
# worktree or vault read, and strips any inherited CURSOR_API_KEY from every agent child.
# Keychain: a per-lane HOME does NOT isolate the macOS login keychain (securityd is per user), so
# isolation rests on: the key is passed only via the child's CURSOR_API_KEY (no `cursor-agent login`,
# no keychain write by run-lane), lane HOME is never the real HOME, and lanes never open a browser
# or the main account's Grok Bot session/profile (prompt rule + no browser launch in run-lane).
forbidden_keys = ["Cursor API key (cvmini cursor-agent)", "Cursor API key - lane1 (ultra)"]
[lane1]
enabled = false         # main account: never used for coding or failover (13 Oct 2026); no key
agent = "cursor"
cmd = "~/.local/bin/cursor-agent"

[lane2]
enabled = false         # no second Cursor lane (Carlvince 13 Oct, final); UniMelb lane retired
agent = "cursor"
cmd = "~/.local/bin/cursor-agent-auto"

[lane3]
agent = "codex"
account = "chatgpt"
cmd = "codex"
role = "primary"        # the only primary
max_concurrent = 2      # parallel codex sessions; enforced by run-lane.sh
until = "2026-10-30"    # Codex access ends 30 Oct 2026; lane auto-skipped after

[lane4]
agent = "opencode"
account = "default"
cmd = "opencode"
role = "primary"        # TEMP (live only): until lane3 max_concurrent=2 is confirmed working; then fallback
