name: polymux-mobile
options:
  bundleIdPrefix: com.flarehq.polymux.mobile
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Polymux
      PRODUCT_BUNDLE_IDENTIFIER: com.flarehq.polymux.mobile
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  polymux-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        buildPhase: none
      - path: polymux-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: polymux-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Polymux uses the camera only when you choose to scan a Desktop pairing QR code.
        NSMicrophoneUsageDescription: Polymux records audio only when you choose to attach a voice message.
        NSLocalNetworkUsageDescription: Polymux connects to your private Personal Host.
        NSFaceIDUsageDescription: Unlock Polymux Vault for password and code AutoFill.
        PolymuxAPNSEnvironment: "$(POLYMUX_APNS_ENVIRONMENT)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [polymux-mobile]
            CFBundleURLName: com.flarehq.polymux.mobile.auth
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: polymux-mobile_iOS/polymux-mobile_iOS.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.flarehq.polymux.mobile]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.flarehq.polymux.mobile", "$(AppIdentifierPrefix)com.flarehq.polymux.mobile.vault"]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        DEVELOPMENT_TEAM: 23YB4896XA
        CODE_SIGN_STYLE: Automatic
        APS_ENVIRONMENT: development
        POLYMUX_APNS_ENVIRONMENT: sandbox
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
      configs:
        release:
          APS_ENVIRONMENT: production
          POLYMUX_APNS_ENVIRONMENT: production
    dependencies:
      - target: PolymuxAutoFill
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  PolymuxAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../apple/AutoFill
      - path: ../../plugins/apple/ios/Sources/AutoFillStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flarehq.polymux.mobile.autofill
        PRODUCT_NAME: PolymuxAutoFill
        DEVELOPMENT_TEAM: 23YB4896XA
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    info:
      path: PolymuxAutoFill/Info.plist
      properties:
        CFBundleDisplayName: Polymux
        NSFaceIDUsageDescription: Unlock Polymux Vault to fill passwords and verification codes.
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).CredentialProviderViewController"
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesOneTimeCodes: true
    entitlements:
      path: PolymuxAutoFill/PolymuxAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.flarehq.polymux.mobile]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.flarehq.polymux.mobile.vault"]
