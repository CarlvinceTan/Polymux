<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `polymux-preview:` is named in img-src and media-src rather than made a
         CSP-bypassing scheme: it serves whatever local file the host has granted,
         so it earns the two contexts that display one and nothing else — script-src
         stays closed to it. media-src has to be written out because it would
         otherwise fall back to default-src, which no scheme but 'self' satisfies. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: polymux-preview:; media-src 'self' data: blob: polymux-media: polymux-preview:; font-src 'self'; connect-src 'self' http: https: ws: wss:" />
    <link rel="icon" type="image/svg+xml" href="/polymux.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/theme-boot.js"></script>
    <title>Polymux</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div id="app"></div>
    <!-- The splash is markup, not a component, so it paints with the first
         frame instead of waiting for the renderer bundle to load and mount.
         The mark is inlined rather than linked for the same reason: a fetched
         image arrives after the wordmark and the lockup visibly reflows.
         App.svelte fades the splash out and removes it once startup finishes. -->
