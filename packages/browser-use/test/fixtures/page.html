<!doctype html>
<html><head><title>Control Harness</title></head>
<body style="font-family: system-ui; margin: 24px">
  <h1>Checkout</h1>
  <p id="status">idle</p>

  <button id="buy" onclick="document.getElementById('status').textContent='bought'">Buy now</button>
  <a href="#done" id="terms">Read the terms</a>

  <label for="promo">Promo code</label>
  <input id="promo" placeholder="SAVE10" value="prefilled">

  <textarea id="notes" placeholder="Delivery notes"></textarea>

  <select id="size">
    <option value="s">Small</option>
    <option value="m">Medium</option>
    <option value="l">Large</option>
  </select>

  <label><input type="checkbox" id="gift"> Gift wrap</label>

  <input type="file" id="upload">

  <button id="confirm" onclick="window.__confirmed = confirm('Place the order?')">Place order</button>

  <div id="covered-wrap" style="position: relative; margin-top: 20px">
    <button id="under">Hidden button</button>
    <div id="overlay" class="cookie-banner"
         style="position:absolute;inset:0;background:rgba(0,0,0,.5)"></div>
  </div>

  <h2>Payment</h2>
  <iframe id="pay" style="width:420px;height:120px;border:1px solid #ccc"
          src="/frame.html" title="payment-frame"></iframe>

  <p id="late"></p>

  <script>
    console.log("harness ready");
    console.error("a deliberate page error");
    document.getElementById('promo').addEventListener('change', () => {
      document.getElementById('status').textContent = 'promo:' + document.getElementById('promo').value;
    });
    document.getElementById('gift').addEventListener('change', (e) => {
      document.getElementById('status').textContent = 'gift:' + e.target.checked;
    });
    document.getElementById('size').addEventListener('change', (e) => {
      document.getElementById('status').textContent = 'size:' + e.target.value;
    });
    document.getElementById('upload').addEventListener('change', (e) => {
      document.getElementById('status').textContent = 'file:' + (e.target.files[0]?.name ?? 'none');
    });
    setTimeout(() => { document.getElementById('late').textContent = 'arrived late'; }, 700);
    fetch('/favicon.ico').catch(() => {});
  </script>
</body></html>
