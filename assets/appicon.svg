<!-- Full-bleed artwork: macOS applies its own squircle mask (and Tahoe its
     glass edge) to app icons, so the source must fill the canvas edge to
     edge. Artwork that carries its own rounded shape gets set on the system's
     grey backing plate instead, which reads as a halo around the icon. The
     ground stays white so the black Polymux mark reads over any wallpaper. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="14 14 172 172" role="img" aria-label="Polymux">
  <rect width="200" height="200" fill="#fff"/>
  <path
    fill="#000"
    transform="translate(-10 0)"
    d="M 40 40 L 120 40 A 60 60 0 0 1 120 160 L 40 160 L 70 120 L 110 120 A 20 20 0 0 0 110 80 L 70 80 Z"
  />
</svg>
