name: Release version

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate dev release version
    runs-on: ubuntu-24.04
    steps:
      - name: Require dev as the release source
        if: github.head_ref != 'dev'
        run: |
          echo "Production releases must be proposed from dev into main."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate version
        run: node scripts/validate-release-version.mjs --base=${{ github.event.pull_request.base.sha }}
      - name: Validate browser compatibility
        run: node scripts/validate-browser-compatibility.mjs --base=${{ github.event.pull_request.base.sha }}
