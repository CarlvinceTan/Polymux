name: Pull request release notes

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release note
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/validate-pr-release-notes.test.mjs
      - name: Validate pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-pr-release-notes.mjs
