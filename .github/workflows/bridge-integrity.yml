name: Bridge integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify official bridge binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify release tags match pinned source commits
        run: node scripts/verify-bridge-pins.mjs

      - uses: actions/cache@v4
        with:
          path: resources/bridges
          key: bridge-integrity-linux-x64-${{ hashFiles('scripts/fetch-bridges.mjs') }}
          restore-keys: |
            bridge-integrity-linux-x64-

      - name: Download and verify official SHA-256 checksums
        run: node scripts/fetch-bridges.mjs --platform=linux --arch=x64

      - name: Prove every bridge starts and answers provisioning
        run: npx tsx scripts/smoke-bridges.mts
