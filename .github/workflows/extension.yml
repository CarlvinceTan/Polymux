name: Chrome extension

on:
  push:
    branches: [main]
    paths:
      - "apps/extension/background.js"
      - "apps/extension/content.js"
      - "apps/extension/lib/**"
      - "apps/extension/icons/**"
      - "apps/extension/manifest.json"
      - "packages/browser/src/**"
      - "scripts/package-chrome-extension.sh"
      - "scripts/validate-extension-version.mjs"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chrome-extension-production
  cancel-in-progress: false

env:
  CWS_EXTENSION_ID: abcoknklbjpjkchpejlfpkjlajmifgnk

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate extension manifest
        run: node scripts/validate-extension-version.mjs

      - name: Package extension
        run: scripts/package-chrome-extension.sh dist/polymux-agent-surface.zip

      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Require Chrome Web Store configuration
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          test -n "$CWS_PUBLISHER_ID" || {
            echo "Repository variable CWS_PUBLISHER_ID is required."
            exit 1
          }

      - name: Require a version newer than the Store draft or release
        id: version_check
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:fetchStatus")"
          printf '%s' "$response" > "$RUNNER_TEMP/cws-status.json"
          previous_version="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const revisions = [value.publishedItemRevisionStatus, value.submittedItemRevisionStatus];
            const versions = revisions.flatMap((revision) =>
              (revision?.distributionChannels ?? []).map((channel) => channel.crxVersion).filter(Boolean));
            const parts = (version) => [...version.split(".").map(Number), 0, 0, 0, 0].slice(0, 4);
            versions.sort((left, right) => {
              const a = parts(left), b = parts(right);
              for (let index = 0; index < 4; index += 1) if (a[index] !== b[index]) return b[index] - a[index];
              return 0;
            });
            process.stdout.write(versions[0] ?? "");
          ' "$RUNNER_TEMP/cws-status.json")"
          current_version="$(node -p "require('./apps/extension/manifest.json').version")"
          if [[ -n "$previous_version" ]]; then
            if [[ "$previous_version" == "$current_version" ]]; then
              echo "Version $current_version is already submitted or published; verifying Store status."
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
            else
              node scripts/validate-extension-version.mjs --previous-version "$previous_version"
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No published or submitted Store package exists; allowing the initial automated upload."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload extension package
        if: steps.version_check.outputs.release_exists != 'true'
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            -X POST \
            --data-binary @dist/polymux-agent-surface.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:upload")"
          printf '%s' "$response" > "$RUNNER_TEMP/cws-upload.json"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!value.itemId || !["SUCCEEDED", "IN_PROGRESS", "UPLOAD_SUCCESS", "UPLOAD_IN_PROGRESS"].includes(value.uploadState)) {
              throw new Error(`Chrome Web Store upload failed: ${JSON.stringify(value)}`);
            }
            console.log(`Uploaded ${value.crxVersion ?? "extension package"} (${value.uploadState}).`);
          ' "$RUNNER_TEMP/cws-upload.json"

      - name: Submit update for review and automatic publication
        if: steps.version_check.outputs.release_exists != 'true'
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          publish() {
            local block_on_warnings="$1"
            curl --silent --show-error \
              --output "$RUNNER_TEMP/cws-publish.json" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "{\"publishType\":\"DEFAULT_PUBLISH\",\"blockOnWarnings\":$block_on_warnings}" \
              "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:publish"
          }

          status_code="$(publish true)"
          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            # Chrome requires explicit confirmation for the extension's
            # intentional all-sites content script and the initial visibility
            # change. Confirm only those known warnings; a new warning remains
            # a hard failure instead of being silently accepted.
            node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const warnings = value.error?.details
                ?.find((detail) => detail["@type"]?.endsWith("WarningsInfo"))
                ?.warnings?.map((warning) => warning.reason) ?? [];
              const expected = new Set(["BROAD_HOST_USAGE", "CHANGING_VISIBILITY"]);
              if (value.error?.status !== "FAILED_PRECONDITION" || warnings.length === 0 ||
                  warnings.some((warning) => !expected.has(warning))) {
                throw new Error(`Chrome Web Store submission returned HTTP ${process.argv[2]}: ${JSON.stringify(value)}`);
              }
              console.log(`Confirming expected Chrome Web Store warnings: ${warnings.join(", ")}.`);
            ' "$RUNNER_TEMP/cws-publish.json" "$status_code"
            status_code="$(publish false)"
            if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
              node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                throw new Error(`Chrome Web Store confirmation returned HTTP ${process.argv[2]}: ${JSON.stringify(value)}`);
              ' "$RUNNER_TEMP/cws-publish.json" "$status_code"
            fi
          fi
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expected = new Set(["BROAD_HOST_USAGE", "CHANGING_VISIBILITY"]);
            const warnings = value.warningInfo?.warnings?.map((warning) => warning.reason) ?? [];
            if (value.itemId !== process.env.CWS_EXTENSION_ID ||
                warnings.some((warning) => !expected.has(warning))) {
              throw new Error(`Chrome Web Store submission failed: ${JSON.stringify(value)}`);
            }
            console.log(`Chrome Web Store accepted the submission${value.state ? `: ${value.state}` : ""}.`);
          ' "$RUNNER_TEMP/cws-publish.json"

      - name: Verify submitted or published Store version
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          expected_version="$(node -p "require('./apps/extension/manifest.json').version")"
          for attempt in {1..6}; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:fetchStatus")"
            printf '%s' "$response" > "$RUNNER_TEMP/cws-final-status.json"
            if node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const expected = process.argv[2];
              const revisions = [value.submittedItemRevisionStatus, value.publishedItemRevisionStatus].filter(Boolean);
              const revision = revisions.find((candidate) =>
                candidate.distributionChannels?.some((channel) => channel.crxVersion === expected));
              if (!revision?.state) process.exit(1);
              console.log(`Chrome Web Store version ${expected}: ${revision.state}.`);
            ' "$RUNNER_TEMP/cws-final-status.json" "$expected_version"; then
              exit 0
            fi
            sleep 5
          done
          echo "Chrome Web Store did not report version $expected_version as submitted or published."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymux-agent-surface
          path: dist/polymux-agent-surface.zip
          if-no-files-found: error
          retention-days: 14
