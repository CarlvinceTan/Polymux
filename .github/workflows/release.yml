name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/site
      - run: npm run check
      - run: npm test
      - run: npm run check --prefix apps/site

  browser-compatibility:
    name: Require compatible published browser extension
    runs-on: ubuntu-24.04
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Verify the minimum compatible extension is published
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_EXTENSION_ID: abcoknklbjpjkchpejlfpkjlajmifgnk
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: node scripts/verify-published-extension.mjs

  phone-ios-runtime:
    name: Build unsigned iPhone control runtime
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-phone-wda.mjs
      - name: Verify and archive WebDriverAgent
        run: |
          WDA="resources/phone/ios/WebDriverAgentRunner-Runner.app"
          test -x "$WDA/WebDriverAgentRunner-Runner"
          test -d "$WDA/PlugIns/WebDriverAgentRunner.xctest"
          test ! -e "$WDA/embedded.mobileprovision"
          test ! -e "$WDA/_CodeSignature"
          test -f resources/phone/ios/LICENSE.WebDriverAgent.txt
          plutil -extract CFBundleIdentifier raw "$WDA/Info.plist" | grep -q '^com.flarehq.polymux.wda.xctrunner$'
          tar -czf phone-ios-wda.tar.gz -C resources/phone/ios \
            WebDriverAgentRunner-Runner.app LICENSE.WebDriverAgent.txt WDA_SOURCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: Polymux-iPhone-WDA
          path: phone-ios-wda.tar.gz
          if-no-files-found: error

  macos:
    needs: [verify, phone-ios-runtime]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Polymux-iPhone-WDA
          path: .phone-ios-runtime
      - name: Restore unsigned iPhone runtime
        run: |
          mkdir -p resources/phone/ios
          tar -xzf .phone-ios-runtime/phone-ios-wda.tar.gz -C resources/phone/ios

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${PACKAGE_VERSION}."
            exit 1
          }

      - run: npm ci
      - run: npm ci --prefix apps/site

      - name: Verify source and website
        run: |
          npx tsc --noEmit
          npm run build
          npm --prefix apps/site test
          npm run check --prefix apps/site
          npm run build --prefix apps/site

      - uses: actions/cache@v4
        with:
          path: |
            resources/bridges
            resources/node
            resources/phone
            resources/whisper
            resources/native/bin
          key: polymux-runtime-${{ runner.os }}-arm64-${{ hashFiles('scripts/fetch-bridges.mjs', 'scripts/fetch-node.mjs', 'scripts/fetch-phone-tools.mjs', 'scripts/fetch-phone-ios-tools.mjs', 'scripts/build-phone-zsign.mjs', 'scripts/build-phone-ios-signer.mjs', 'scripts/build-phone-ios-signer-runtime.mjs', 'scripts/phone-ios-signer-helper.py', 'scripts/build-phone-ios-device.mjs', 'scripts/phone-ios-device-helper.py', 'scripts/phone-ios-device-*.lock', 'scripts/fetch-whisper.mjs', 'scripts/build-native-helpers.ts', 'resources/native/*.swift', 'apps/desktop/src/main/system/permission-usage.ts') }}

      - name: Require release credentials
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CERT_P12" && test -n "$CERT_PASSWORD" && test -n "$APPLE_ID" && \
            test -n "$APPLE_ID_PASSWORD" && test -n "$APPLE_TEAM_ID" || {
              echo "A tagged release requires the macOS signing and notarisation secrets."
              exit 1
            }

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/polymux-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/polymux-signing.keychain-db"
          printf '%s' "$CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity was imported."; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build installers
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          POLYMUX_TELEGRAM_API_ID: ${{ secrets.POLYMUX_TELEGRAM_API_ID }}
          POLYMUX_TELEGRAM_API_HASH: ${{ secrets.POLYMUX_TELEGRAM_API_HASH }}
          POLYMUX_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.POLYMUX_GOOGLE_DRIVE_CLIENT_ID }}
          POLYMUX_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.POLYMUX_GOOGLE_DRIVE_CLIENT_SECRET }}
          POLYMUX_DROPBOX_CLIENT_ID: ${{ secrets.POLYMUX_DROPBOX_CLIENT_ID }}
          POLYMUX_DROPBOX_CLIENT_SECRET: ${{ secrets.POLYMUX_DROPBOX_CLIENT_SECRET }}
          POLYMUX_ONEDRIVE_CLIENT_ID: ${{ secrets.POLYMUX_ONEDRIVE_CLIENT_ID }}
          POLYMUX_ONEDRIVE_CLIENT_SECRET: ${{ secrets.POLYMUX_ONEDRIVE_CLIENT_SECRET }}
          POLYMUX_GOOGLE_MAIL_CLIENT_ID: ${{ secrets.POLYMUX_GOOGLE_MAIL_CLIENT_ID }}
          POLYMUX_GOOGLE_MAIL_CLIENT_SECRET: ${{ secrets.POLYMUX_GOOGLE_MAIL_CLIENT_SECRET }}
          POLYMUX_MICROSOFT_MAIL_CLIENT_ID: ${{ secrets.POLYMUX_MICROSOFT_MAIL_CLIENT_ID }}
          POLYMUX_MICROSOFT_MAIL_CLIENT_SECRET: ${{ secrets.POLYMUX_MICROSOFT_MAIL_CLIENT_SECRET }}
        run: |
          node scripts/verify-release-connections.mjs
          npm run make -- --arch=arm64

      - name: Verify packaged artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="out/Polymux-darwin-arm64/Polymux.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Contents/Info.plist"
          file "$APP_PATH/Contents/MacOS/Polymux" | grep -q 'arm64'
          WHISPER="$APP_PATH/Contents/Resources/resources/whisper"
          for binary in whisper-cli whisper-server; do
            test -x "$WHISPER/$binary"
            file "$WHISPER/$binary" | grep -q 'arm64'
            ! otool -L "$WHISPER/$binary" | grep -E '/opt/homebrew|/usr/local'
          done
          "$WHISPER/whisper-cli" --version
          "$WHISPER/whisper-server" --help >/dev/null
          PHONE="$APP_PATH/Contents/Resources/resources/phone/android"
          for binary in adb scrcpy; do
            test -x "$PHONE/$binary"
            file "$PHONE/$binary" | grep -q 'arm64'
            ! otool -L "$PHONE/$binary" | grep -E '/opt/homebrew|/usr/local'
          done
          test -f "$PHONE/scrcpy-server"
          "$PHONE/adb" version
          SCRCPY_SERVER_PATH="$PHONE/scrcpy-server" "$PHONE/scrcpy" --version
          IOS_PHONE="$APP_PATH/Contents/Resources/resources/phone/ios/tools"
          test -x "$IOS_PHONE/ios"
          test -f "$IOS_PHONE/LICENSE.go-ios.txt"
          file "$IOS_PHONE/ios" | grep -q 'arm64'
          ! otool -L "$IOS_PHONE/ios" | grep -E '/opt/homebrew|/usr/local'
          "$IOS_PHONE/ios" version
          IOS_SIGNER="$APP_PATH/Contents/Resources/resources/phone/ios/signer"
          test -x "$IOS_SIGNER/python/bin/python3"
          test -x "$IOS_SIGNER/zsign"
          test -f "$IOS_SIGNER/MANIFEST.json"
          ! otool -L "$IOS_SIGNER/zsign" | grep -E '/opt/homebrew|/usr/local'
          printf '%s\n' '{"id":"release","method":"ping"}' | \
            LOCALAPPDATA="$RUNNER_TEMP/polymux-phone-signer" PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 \
            "$IOS_SIGNER/python/bin/python3" "$IOS_SIGNER/helper.py" | \
            grep -q '"protocolVersion":1'
          "$IOS_SIGNER/zsign" -v
          IOS_DEVICE="$APP_PATH/Contents/Resources/resources/phone/ios/device"
          test -f "$IOS_DEVICE/LICENSE.pymobiledevice3.txt"
          test -f "$IOS_DEVICE/LICENSE.phone-ios-device-helper.txt"
          test -f "$IOS_DEVICE/SOURCE_ARCHIVES.json"
          test -f "$IOS_DEVICE/sources/pymobiledevice3-11.3.0.tar.gz"
          test -f "$IOS_DEVICE/sources/pmd_pytcp-0.3.7.tar.gz"
          test -f "$IOS_DEVICE/sources/pygnuutils-0.1.1.tar.gz"
          test -x "$IOS_DEVICE/python/bin/python3"
          "$IOS_DEVICE/python/bin/python3" --version | grep -q 'Python 3.13'
          "$IOS_DEVICE/python/bin/python3" "$IOS_DEVICE/helper.py" ping | \
            grep -q '"protocolVersion":1'
          WDA="$APP_PATH/Contents/Resources/resources/phone/ios/WebDriverAgentRunner-Runner.app"
          test -x "$WDA/WebDriverAgentRunner-Runner"
          test -d "$WDA/PlugIns/WebDriverAgentRunner.xctest"
          test -f "$APP_PATH/Contents/Resources/resources/phone/ios/WDA_SOURCE.json"
          plutil -extract CFBundleIdentifier raw "$WDA/Info.plist" | grep -q '^com.flarehq.polymux.wda.xctrunner$'
          NATIVE="$APP_PATH/Contents/Resources/resources/native/bin"
          for helper in app-permissions ax-events ax-reader calendar contacts pill-image reminders wechat-media-prepare wechat-paste-send wechat-prime; do
            test -x "$NATIVE/$helper"
            file "$NATIVE/$helper" | grep -q 'arm64'
          done
          WECHAT_WRITER="$APP_PATH/Contents/Resources/resources/wechat-writer"
          test -x "$WECHAT_WRITER/polymux-wechat-driver.mjs"
          for file in wechat-daemon-coordination.mjs wechat-wire.mjs wechat_native_cdn_upload_lldb.py wechat_native_task_lldb.py; do
            test -f "$WECHAT_WRITER/$file"
          done
          test -d "$WECHAT_WRITER/node_modules/silk-wasm/lib"
          DMG="$(find out/make -type f -name '*.dmg' -print -quit)"
          ZIP="$(find out/make -type f -name '*.zip' -print -quit)"
          test -n "$DMG" && test -n "$ZIP"
          hdiutil verify "$DMG"
          unzip -tq "$ZIP"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: Polymux-macOS-arm64
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  windows:
    needs: [verify, phone-ios-runtime]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Polymux-iPhone-WDA
          path: .phone-ios-runtime
      - name: Restore unsigned iPhone runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/phone/ios | Out-Null
          tar -xzf .phone-ios-runtime/phone-ios-wda.tar.gz -C resources/phone/ios
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false
      - name: Configure Windows bridge compiler
        shell: pwsh
        run: |
          $compiler = (Get-Command gcc.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $compiler = @(
              'C:\mingw64\bin\gcc.exe',
              'C:\msys64\ucrt64\bin\gcc.exe',
              'C:\msys64\mingw64\bin\gcc.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not (Test-Path $compiler)) { throw 'The Windows bridge compiler is missing.' }
          $directory = Split-Path -Parent $compiler
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:tools
      - uses: actions/cache@v4
        with:
          path: |
            resources/phone
            resources/whisper
          key: polymux-runtime-${{ runner.os }}-x64-${{ hashFiles('scripts/fetch-phone-tools.mjs', 'scripts/fetch-phone-ios-tools.mjs', 'scripts/build-phone-ios-signer.mjs', 'scripts/build-phone-ios-signer-runtime.mjs', 'scripts/phone-ios-signer-helper.py', 'scripts/build-phone-ios-device.mjs', 'scripts/phone-ios-device-helper.py', 'scripts/phone-ios-device-*.lock', 'scripts/fetch-whisper.mjs') }}
      - name: Build installers
        shell: pwsh
        env:
          POLYMUX_TELEGRAM_API_ID: ${{ secrets.POLYMUX_TELEGRAM_API_ID }}
          POLYMUX_TELEGRAM_API_HASH: ${{ secrets.POLYMUX_TELEGRAM_API_HASH }}
          POLYMUX_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.POLYMUX_GOOGLE_DRIVE_CLIENT_ID }}
          POLYMUX_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.POLYMUX_GOOGLE_DRIVE_CLIENT_SECRET }}
          POLYMUX_DROPBOX_CLIENT_ID: ${{ secrets.POLYMUX_DROPBOX_CLIENT_ID }}
          POLYMUX_DROPBOX_CLIENT_SECRET: ${{ secrets.POLYMUX_DROPBOX_CLIENT_SECRET }}
          POLYMUX_ONEDRIVE_CLIENT_ID: ${{ secrets.POLYMUX_ONEDRIVE_CLIENT_ID }}
          POLYMUX_ONEDRIVE_CLIENT_SECRET: ${{ secrets.POLYMUX_ONEDRIVE_CLIENT_SECRET }}
          POLYMUX_GOOGLE_MAIL_CLIENT_ID: ${{ secrets.POLYMUX_GOOGLE_MAIL_CLIENT_ID }}
          POLYMUX_GOOGLE_MAIL_CLIENT_SECRET: ${{ secrets.POLYMUX_GOOGLE_MAIL_CLIENT_SECRET }}
          POLYMUX_MICROSOFT_MAIL_CLIENT_ID: ${{ secrets.POLYMUX_MICROSOFT_MAIL_CLIENT_ID }}
          POLYMUX_MICROSOFT_MAIL_CLIENT_SECRET: ${{ secrets.POLYMUX_MICROSOFT_MAIL_CLIENT_SECRET }}
        run: |
          node scripts/verify-release-connections.mjs
          npm run make -- --arch=x64
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/make -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          $package = Get-ChildItem out/make -Recurse -Filter '*.nupkg' | Select-Object -First 1
          if (-not $setup -or -not $package) { throw 'Windows installer artifacts are missing.' }
          $resources = 'out/Polymux-win32-x64/resources'
          foreach ($macOnly in @(
            'wxcdn_fileid_capture.py',
            'resources/native/bin',
            'resources/wechat-writer'
          )) {
            if (Test-Path (Join-Path $resources $macOnly)) {
              throw "The Windows package contains macOS-only WeChat runtime: $macOnly"
            }
          }
          $bridges = 'out/Polymux-win32-x64/resources/resources/bridges'
          $expected = @(
            'mautrix-bluesky.exe',
            'mautrix-gmessages.exe',
            'mautrix-googlechat.exe',
            'mautrix-gvoice.exe',
            'mautrix-instagram.exe',
            'mautrix-linkedin.exe',
            'mautrix-meta.exe',
            'mautrix-slack.exe',
            'mautrix-telegram.exe',
            'mautrix-twitter.exe',
            'mautrix-whatsapp.exe',
            'mautrix-zulip.exe'
          )
          $actual = @(Get-ChildItem $bridges -File -Filter 'mautrix-*.exe' |
            Select-Object -ExpandProperty Name | Sort-Object)
          $difference = Compare-Object $expected $actual
          if ($difference) {
            $difference | Out-String | Write-Host
            throw 'The Windows package does not contain the complete messaging bridge fleet.'
          }
          foreach ($bridge in Get-ChildItem $bridges -File -Filter 'mautrix-*.exe') {
            & $bridge.FullName -v | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "$($bridge.Name) could not run on Windows." }
          }
          & 'out/Polymux-win32-x64/resources/resources/node/node.exe' -e `
            "if(process.platform!=='win32'||process.arch!=='x64')process.exit(1)"
          $whisper = 'out/Polymux-win32-x64/resources/resources/whisper'
          $expectedWhisper = @(
            'ggml-base.dll',
            'ggml.dll',
            'LICENSE.whisper.cpp.txt',
            'MANIFEST.json',
            'VERSION',
            'whisper-cli.exe',
            'whisper-server.exe',
            'whisper.dll'
          )
          foreach ($name in $expectedWhisper) {
            if (-not (Test-Path (Join-Path $whisper $name))) {
              throw "The Windows package is missing $name from its dictation runtime."
            }
          }
          & (Join-Path $whisper 'whisper-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged whisper-cli could not run on Windows.' }
          & (Join-Path $whisper 'whisper-server.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The packaged whisper-server could not run on Windows.' }
          $phone = 'out/Polymux-win32-x64/resources/resources/phone/android'
          foreach ($name in @('adb.exe', 'scrcpy.exe', 'scrcpy-server', 'LICENSE.scrcpy.txt', 'MANIFEST.json', 'VERSION')) {
            if (-not (Test-Path (Join-Path $phone $name))) {
              throw "The Windows package is missing $name from its Android phone runtime."
            }
          }
          & (Join-Path $phone 'adb.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged adb could not run on Windows.' }
          $env:SCRCPY_SERVER_PATH = Join-Path $phone 'scrcpy-server'
          & (Join-Path $phone 'scrcpy.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged scrcpy could not run on Windows.' }
          $iosPhone = 'out/Polymux-win32-x64/resources/resources/phone/ios/tools'
          foreach ($name in @('ios.exe', 'LICENSE.go-ios.txt', 'MANIFEST.json', 'VERSION')) {
            if (-not (Test-Path (Join-Path $iosPhone $name))) {
              throw "The Windows package is missing $name from its iPhone runtime."
            }
          }
          & (Join-Path $iosPhone 'ios.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged go-ios runtime could not run on Windows.' }
          $iosSigner = 'out/Polymux-win32-x64/resources/resources/phone/ios/signer'
          foreach ($name in @('python/python.exe', 'helper.py', 'zsign.exe', 'MANIFEST.json', 'VERSION')) {
            if (-not (Test-Path (Join-Path $iosSigner $name))) {
              throw "The Windows package is missing $name from its local iPhone signer."
            }
          }
          $env:PYTHONUTF8 = '1'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $signerResponse = '{"id":"release","method":"ping"}' | & (Join-Path $iosSigner 'python/python.exe') (Join-Path $iosSigner 'helper.py')
          if ($LASTEXITCODE -ne 0 -or $signerResponse -notmatch '"protocolVersion":1') {
            throw 'The packaged local iPhone signer could not run on Windows.'
          }
          & (Join-Path $iosSigner 'zsign.exe') -v
          if ($LASTEXITCODE -ne 0) { throw 'The packaged zsign could not run on Windows.' }
          $iosDevice = 'out/Polymux-win32-x64/resources/resources/phone/ios/device'
          foreach ($name in @('helper.py', 'LICENSE.pymobiledevice3.txt', 'LICENSE.phone-ios-device-helper.txt', 'SOURCE_ARCHIVES.json', 'sources/pymobiledevice3-11.3.0.tar.gz', 'sources/pmd_pytcp-0.3.7.tar.gz', 'sources/pygnuutils-0.1.1.tar.gz', 'MANIFEST.json', 'VERSION')) {
            if (-not (Test-Path (Join-Path $iosDevice $name))) {
              throw "The Windows package is missing $name from its iPhone tunnel runtime."
            }
          }
          $devicePython = Join-Path $iosDevice 'python/python.exe'
          if (-not (Test-Path $devicePython)) { throw 'The Windows package is missing the iPhone tunnel Python runtime.' }
          & $devicePython --version | Select-String 'Python 3.13' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The iPhone tunnel Python runtime has the wrong version.' }
          $deviceResponse = & $devicePython (Join-Path $iosDevice 'helper.py') ping
          if ($LASTEXITCODE -ne 0 -or $deviceResponse -notmatch '"protocolVersion":1') {
            throw 'The packaged iPhone tunnel helper could not run on Windows.'
          }
          $wda = 'out/Polymux-win32-x64/resources/resources/phone/ios/WebDriverAgentRunner-Runner.app'
          foreach ($path in @(
            (Join-Path $wda 'Info.plist'),
            (Join-Path $wda 'WebDriverAgentRunner-Runner'),
            (Join-Path $wda 'PlugIns/WebDriverAgentRunner.xctest'),
            'out/Polymux-win32-x64/resources/resources/phone/ios/WDA_SOURCE.json'
          )) {
            if (-not (Test-Path $path)) { throw "The Windows package is missing iPhone WDA content: $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Polymux-Windows-x64
          path: |
            out/make/**/*Setup.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
          if-no-files-found: error

  linux:
    needs: [verify, phone-ios-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Polymux-iPhone-WDA
          path: .phone-ios-runtime
      - name: Restore unsigned iPhone runtime
        run: |
          mkdir -p resources/phone/ios
          tar -xzf .phone-ios-runtime/phone-ios-wda.tar.gz -C resources/phone/ios
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            resources/bridges
            resources/node
            resources/phone
            resources/whisper
          key: polymux-runtime-${{ runner.os }}-x64-${{ hashFiles('scripts/fetch-bridges.mjs', 'scripts/fetch-node.mjs', 'scripts/fetch-phone-tools.mjs', 'scripts/fetch-phone-ios-tools.mjs', 'scripts/build-phone-ios-signer.mjs', 'scripts/build-phone-ios-signer-runtime.mjs', 'scripts/phone-ios-signer-helper.py', 'scripts/build-phone-ios-device.mjs', 'scripts/phone-ios-device-helper.py', 'scripts/phone-ios-device-*.lock', 'scripts/fetch-whisper.mjs') }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:tools
      - name: Package app
        env:
          POLYMUX_TELEGRAM_API_ID: ${{ secrets.POLYMUX_TELEGRAM_API_ID }}
          POLYMUX_TELEGRAM_API_HASH: ${{ secrets.POLYMUX_TELEGRAM_API_HASH }}
          POLYMUX_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.POLYMUX_GOOGLE_DRIVE_CLIENT_ID }}
          POLYMUX_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.POLYMUX_GOOGLE_DRIVE_CLIENT_SECRET }}
          POLYMUX_DROPBOX_CLIENT_ID: ${{ secrets.POLYMUX_DROPBOX_CLIENT_ID }}
          POLYMUX_DROPBOX_CLIENT_SECRET: ${{ secrets.POLYMUX_DROPBOX_CLIENT_SECRET }}
          POLYMUX_ONEDRIVE_CLIENT_ID: ${{ secrets.POLYMUX_ONEDRIVE_CLIENT_ID }}
          POLYMUX_ONEDRIVE_CLIENT_SECRET: ${{ secrets.POLYMUX_ONEDRIVE_CLIENT_SECRET }}
          POLYMUX_GOOGLE_MAIL_CLIENT_ID: ${{ secrets.POLYMUX_GOOGLE_MAIL_CLIENT_ID }}
          POLYMUX_GOOGLE_MAIL_CLIENT_SECRET: ${{ secrets.POLYMUX_GOOGLE_MAIL_CLIENT_SECRET }}
          POLYMUX_MICROSOFT_MAIL_CLIENT_ID: ${{ secrets.POLYMUX_MICROSOFT_MAIL_CLIENT_ID }}
          POLYMUX_MICROSOFT_MAIL_CLIENT_SECRET: ${{ secrets.POLYMUX_MICROSOFT_MAIL_CLIENT_SECRET }}
        run: |
          node scripts/verify-release-connections.mjs
          npm run package -- --platform=linux --arch=x64
      - run: npm run make:appimage
      - name: Verify Linux artifacts
        run: |
          APPIMAGE="$(find out/make/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          test -f out/make/appimage/latest-linux.yml
          file "$APPIMAGE" | grep -q 'ELF 64-bit.*x86-64'
          APPIMAGE="$(realpath "$APPIMAGE")"
          EXTRACTED="$(mktemp -d)"
          (
            cd "$EXTRACTED"
            "$APPIMAGE" --appimage-extract >/dev/null
          )
          BRIDGES="$EXTRACTED/squashfs-root/resources/resources/bridges"
          EXPECTED=(
            mautrix-bluesky
            mautrix-discord
            mautrix-gmessages
            mautrix-googlechat
            mautrix-gvoice
            mautrix-instagram
            mautrix-linkedin
            mautrix-meta
            mautrix-signal
            mautrix-slack
            mautrix-telegram
            mautrix-twitter
            mautrix-whatsapp
            mautrix-zulip
          )
          mapfile -t ACTUAL < <(find "$BRIDGES" -maxdepth 1 -type f -name 'mautrix-*' -printf '%f\n' | sort)
          diff <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          for bridge in "${ACTUAL[@]}"; do
            test -x "$BRIDGES/$bridge"
            file "$BRIDGES/$bridge" | grep -q 'ELF 64-bit.*x86-64'
            "$BRIDGES/$bridge" -v
          done
          test ! -e "$BRIDGES/mautrix-imessage"
          test ! -e "$EXTRACTED/squashfs-root/resources/wxcdn_fileid_capture.py"
          test ! -e "$EXTRACTED/squashfs-root/resources/resources/native/bin"
          test ! -e "$EXTRACTED/squashfs-root/resources/resources/wechat-writer"
          "$EXTRACTED/squashfs-root/resources/resources/node/node" -e \
            "if(process.platform!=='linux'||process.arch!=='x64')process.exit(1)"
          WHISPER="$EXTRACTED/squashfs-root/resources/resources/whisper"
          test -x "$WHISPER/whisper-cli"
          test -x "$WHISPER/whisper-server"
          file "$WHISPER/whisper-cli" | grep -q 'ELF 64-bit.*x86-64'
          file "$WHISPER/whisper-server" | grep -q 'ELF 64-bit.*x86-64'
          ! ldd "$WHISPER/whisper-cli" | grep -q 'not found'
          ! ldd "$WHISPER/whisper-server" | grep -q 'not found'
          "$WHISPER/whisper-cli" --version
          "$WHISPER/whisper-server" --help >/dev/null
          PHONE="$EXTRACTED/squashfs-root/resources/resources/phone/android"
          test -x "$PHONE/adb"
          test -x "$PHONE/scrcpy"
          test -f "$PHONE/scrcpy-server"
          file "$PHONE/adb" | grep -q 'ELF 64-bit.*x86-64'
          file "$PHONE/scrcpy" | grep -q 'ELF 64-bit.*x86-64'
          ! ldd "$PHONE/adb" | grep -q 'not found'
          ! ldd "$PHONE/scrcpy" | grep -q 'not found'
          "$PHONE/adb" version
          SCRCPY_SERVER_PATH="$PHONE/scrcpy-server" "$PHONE/scrcpy" --version
          IOS_PHONE="$EXTRACTED/squashfs-root/resources/resources/phone/ios/tools"
          test -x "$IOS_PHONE/ios"
          test -f "$IOS_PHONE/LICENSE.go-ios.txt"
          file "$IOS_PHONE/ios" | grep -q 'ELF 64-bit.*x86-64'
          ! ldd "$IOS_PHONE/ios" | grep -q 'not found'
          "$IOS_PHONE/ios" version
          IOS_SIGNER="$EXTRACTED/squashfs-root/resources/resources/phone/ios/signer"
          test -x "$IOS_SIGNER/python/bin/python3"
          test -x "$IOS_SIGNER/zsign"
          test -f "$IOS_SIGNER/MANIFEST.json"
          file "$IOS_SIGNER/zsign" | grep -q 'ELF 64-bit.*x86-64'
          printf '%s\n' '{"id":"release","method":"ping"}' | \
            LOCALAPPDATA="$EXTRACTED/signer-state" PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 \
            "$IOS_SIGNER/python/bin/python3" "$IOS_SIGNER/helper.py" | \
            grep -q '"protocolVersion":1'
          "$IOS_SIGNER/zsign" -v
          IOS_DEVICE="$EXTRACTED/squashfs-root/resources/resources/phone/ios/device"
          test -f "$IOS_DEVICE/LICENSE.pymobiledevice3.txt"
          test -f "$IOS_DEVICE/LICENSE.phone-ios-device-helper.txt"
          test -f "$IOS_DEVICE/SOURCE_ARCHIVES.json"
          test -f "$IOS_DEVICE/sources/pymobiledevice3-11.3.0.tar.gz"
          test -f "$IOS_DEVICE/sources/pmd_pytcp-0.3.7.tar.gz"
          test -f "$IOS_DEVICE/sources/pygnuutils-0.1.1.tar.gz"
          test -x "$IOS_DEVICE/python/bin/python3"
          "$IOS_DEVICE/python/bin/python3" --version | grep -q 'Python 3.13'
          "$IOS_DEVICE/python/bin/python3" "$IOS_DEVICE/helper.py" ping | \
            grep -q '"protocolVersion":1'
          WDA="$EXTRACTED/squashfs-root/resources/resources/phone/ios/WebDriverAgentRunner-Runner.app"
          test -x "$WDA/WebDriverAgentRunner-Runner"
          test -d "$WDA/PlugIns/WebDriverAgentRunner.xctest"
          test -f "$EXTRACTED/squashfs-root/resources/resources/phone/ios/WDA_SOURCE.json"
          file "$WDA/WebDriverAgentRunner-Runner" | grep -q 'Mach-O 64-bit.*arm64'
          rm -rf "$EXTRACTED"
      - uses: actions/upload-artifact@v4
        with:
          name: Polymux-Linux-x64
          path: |
            out/make/appimage/*.AppImage
            out/make/appimage/latest-linux.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [browser-compatibility, macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ASSETS < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*Setup.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.AppImage' -o -name 'latest-linux.yml' \) \
            -print)
          test "${#ASSETS[@]}" -ge 7
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --generate-notes \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Polymux ${GITHUB_REF_NAME#v}"
